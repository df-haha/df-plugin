<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>%TITLE%</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEEC;--surface:#FFFFFF;--ink:#14302B;--ink-2:#4A5F5A;--line:#CFD9D6;
  --pick:#0F766E;--pick-soft:#D5EEEA;
  --wait:#A64B00;--wait-soft:#FCEBD6;--going:#1E4FB8;--going-soft:#DCE6FB;--done:#5B6764;--done-soft:#E3E7E6;
  --focus:#0F766E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0F1A18;--surface:#17241F;--ink:#E4EEEB;--ink-2:#9DB1AC;--line:#2A3A36;
  --pick:#3CC2B2;--pick-soft:#173B36;
  --wait:#F2A65A;--wait-soft:#3A2715;--going:#8FB0F5;--going-soft:#1B2A4A;--done:#A3B0AD;--done-soft:#253230;--focus:#3CC2B2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:40px 16px 140px}
header{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;margin-bottom:28px}
h1{margin:0;font-weight:900;font-size:clamp(26px,4vw,34px);letter-spacing:.01em}
.lead{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.tally{text-align:right;line-height:1}
.tally b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(56px,9vw,88px);color:var(--pick);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tally span{display:block;color:var(--ink-2);font-size:14px;margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ink-2)}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip small{color:var(--ink-2);font-variant-numeric:tabular-nums}
section.proj{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.ph h2{margin:0;font-size:18px;font-weight:700;flex:1}
.ph .cnt{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ph .cnt em{font-style:normal;color:var(--pick);font-size:20px}
.row{display:grid;grid-template-columns:28px 92px 1fr;gap:14px;align-items:start;padding:14px 18px 14px 15px;border-left:3px solid transparent;cursor:pointer;transition:background .15s,opacity .15s}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:color-mix(in srgb,var(--pick-soft) 45%,transparent)}
.row.on{border-left-color:var(--pick)}
.row:not(.on) .desc,.row:not(.on) .tag{opacity:.5}
.desc{max-width:68ch}
.desc .nm{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
input[type=checkbox]{appearance:none;margin:2px 0 0;width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-2);background:var(--surface);cursor:pointer;display:grid;place-content:center;transition:background .12s,border-color .12s}
input[type=checkbox]::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
input[type=checkbox]:checked{background:var(--pick);border-color:var(--pick)}
input[type=checkbox]:checked::after{opacity:1}
input[type=checkbox]:indeterminate{background:var(--pick-soft);border-color:var(--pick)}
input[type=checkbox]:indeterminate::after{opacity:1;width:10px;height:0;border-width:0 0 3px 0;border-color:var(--pick);transform:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tag{display:inline-block;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;margin-top:1px}
.tag.wait{background:var(--wait-soft);color:var(--wait)}.tag.going{background:var(--going-soft);color:var(--going)}.tag.done,.tag.unknown{background:var(--done-soft);color:var(--done)}
.chip i.wait{background:var(--wait)}.chip i.going{background:var(--going)}.chip i.done,.chip i.unknown{background:var(--done)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:980px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .sum{flex:1;min-width:180px;color:var(--ink-2)}
.bar .sum b{color:var(--ink)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn.pri{background:var(--pick);border-color:var(--pick);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201C}}
#msg{width:100%;font-size:14px;color:var(--pick);min-height:0}
#msg:empty{display:none}
textarea{display:none;width:100%;height:170px;margin-top:8px;font:13px/1.55 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
@media (max-width:640px){
  header{grid-template-columns:1fr}.tally{text-align:left}
  .row{grid-template-columns:28px 1fr}.row .tag{grid-column:2;justify-self:start}.row .desc{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header>
  <div><h1>%HEADING%</h1>
  <p class="lead">%LEAD%</p></div>
  <div class="tally" aria-live="polite"><b id="big">0</b><span>個%VERB_ON%</span></div>
</header>
<div class="filters" id="filters"></div>
<div id="list"></div>
</main>
<div class="bar"><div class="in">
  <div class="sum" id="sum"></div>
  <button class="btn" id="dl">下載 .txt</button>
  <button class="btn pri" id="copy">複製選擇結果</button>
  <div id="msg" role="status"></div>
  <textarea id="ta" readonly aria-label="選擇結果文字"></textarea>
</div></div>
<script>
const DATA=%DATA%;
const LABEL={wait:"等你決定",going:"進行中",done:"已收尾",unknown:"未分類"};
const M=%MODE%;
const picked=new Set(DATA.filter(d=>d.st!=="done").map(d=>d.sid));
const projs=[...new Set(DATA.map(d=>d.proj))];
const list=document.getElementById("list");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
list.innerHTML=projs.map((p,pi)=>{const rs=DATA.filter(d=>d.proj===p);
 return `<section class="proj" data-p="${pi}"><div class="ph"><input type="checkbox" class="pall" aria-label="${esc(p)} 全選"><h2>${esc(p)}</h2><span class="cnt"><em>0</em> / ${rs.length}</span></div>`+
 rs.map(d=>`<label class="row" data-sid="${d.sid}"><input type="checkbox" class="one" value="${d.sid}"><span class="tag ${d.st}">${LABEL[d.st]}</span><span class="desc">${esc(d.desc)}<span class="nm">${esc(d.name)}</span></span></label>`).join("")+`</section>`}).join("");
const filters=document.getElementById("filters");
filters.innerHTML=["wait","going","done","unknown"].filter(st=>DATA.some(d=>d.st===st)).map(st=>{const n=DATA.filter(d=>d.st===st).length;
 return `<button class="chip" data-st="${st}" title="切換這一類全部勾選"><i class="${st}"></i>${LABEL[st]} <small>${n}</small></button>`}).join("")+
 `<button class="chip" data-all="1">全選</button><button class="chip" data-none="1">全不選</button>`;
function render(){
 document.querySelectorAll(".one").forEach(b=>{b.checked=picked.has(b.value);b.closest(".row").classList.toggle("on",b.checked)});
 document.querySelectorAll("section.proj").forEach(s=>{const ones=[...s.querySelectorAll(".one")],on=ones.filter(b=>b.checked).length,a=s.querySelector(".pall");
  a.checked=on===ones.length;a.indeterminate=on>0&&on<ones.length;s.querySelector(".cnt em").textContent=on});
 document.getElementById("big").textContent=picked.size;
 document.getElementById("sum").innerHTML=`${M.on} <b>${picked.size}</b> 個，${M.off} <b>${DATA.length-picked.size}</b> 個`;
}
list.addEventListener("change",e=>{const t=e.target;
 if(t.classList.contains("one")){t.checked?picked.add(t.value):picked.delete(t.value)}
 if(t.classList.contains("pall")){t.closest("section").querySelectorAll(".one").forEach(b=>t.checked?picked.add(b.value):picked.delete(b.value))}
 render()});
list.addEventListener("click",e=>{const ph=e.target.closest(".ph");if(ph&&!e.target.matches("input")){const a=ph.querySelector(".pall");a.checked=!a.checked;a.dispatchEvent(new Event("change",{bubbles:true}))}});
filters.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;
 if(c.dataset.all)DATA.forEach(d=>picked.add(d.sid));
 else if(c.dataset.none)picked.clear();
 else{const rs=DATA.filter(d=>d.st===c.dataset.st),allOn=rs.every(d=>picked.has(d.sid));rs.forEach(d=>allOn?picked.delete(d.sid):picked.add(d.sid))}
 render()});
function text(){const f=d=>`- ${d.proj}｜${d.name}（${d.sid}）`,on=DATA.filter(d=>picked.has(d.sid)),off=DATA.filter(d=>!picked.has(d.sid));
 return `${M.title}（快照 ${M.snap}）\n${M.on} ${on.length} 個：\n${on.map(f).join("\n")||"- 無"}\n\n${M.off} ${off.length} 個：\n${off.map(f).join("\n")||"- 無"}`}
const msg=s=>document.getElementById("msg").textContent=s;
document.getElementById("copy").onclick=async()=>{const t=text(),ta=document.getElementById("ta");ta.value=t;ta.style.display="block";
 try{await navigator.clipboard.writeText(t);msg("已複製選擇結果，貼回給 Claude 即可。")}catch(e){ta.select();msg("瀏覽器不允許自動複製，請在下方框內按 Ctrl+C。")}};
document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text()],{type:"text/plain"}));a.download="session-restore-pick.txt";a.click();msg("已下載 session-restore-pick.txt。")};
render();
</script></body></html>
