[project]
name = "daily-agenda"
version = "0.0.1.dev0"
description = "daily-agenda plugin local scripts"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "mcp>=1.2,<2",
    "openpyxl==3.1.5",
    "pdfminer.six==20260107",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_agenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
